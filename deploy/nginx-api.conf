# /etc/nginx/sites-available/api.sr-tradelink.com
server {
    listen 80;
    server_name api.sr-tradelink.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.sr-tradelink.com;

    # ssl_certificate /etc/letsencrypt/live/api.sr-tradelink.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.sr-tradelink.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS fallback (Express also sets these when backend is up)
        add_header Access-Control-Allow-Origin "https://sr-tradelink.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
